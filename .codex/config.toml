[mcp_servers.serena]
command = "bash"
args = ["-c", "export PATH=\"$HOME/.local/bin:$HOME/.cargo/bin:$HOME/homebrew/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:${PATH:-}\"; exec \"$HOME/.dotfiles/.local/bin/serena_wrapper.sh\" \"$@\"", "serena", "--context", "claude-code", "--project-from-cwd", "--log-level", "ERROR"]
startup_timeout_sec = 90

# Direct lean-ctx entry: sole path to ctx_shell/ctx_read/ctx_glob/ctx_tree/ctx_search/ctx_compose
# reached directly. An earlier gateway-only registration caused ctx_shell failures (see
# fix/serena-lean-ctx-codex-sessions), which is why the direct entry exists.
[mcp_servers.lean-ctx]
command = "bash"
args = ["-c", "exec \"$HOME/.dotfiles/.local/bin/lean_ctx_wrapper.sh\" mcp --stdio"]
startup_timeout_sec = 90
enabled_tools = ["ctx_compose", "ctx_read", "ctx_search", "ctx_tree", "ctx_expand"]

[mcp_servers.lean-ctx.tools.ctx_compose]
approval_mode = "approve"

[mcp_servers.lean-ctx.tools.ctx_read]
approval_mode = "approve"

[mcp_servers.lean-ctx.tools.ctx_search]
approval_mode = "approve"

[mcp_servers.lean-ctx.tools.ctx_tree]
approval_mode = "approve"

[mcp_servers.lean-ctx.tools.ctx_expand]
approval_mode = "approve"

[mcp_servers.lean-ctx.env]
LEAN_CTX_CACHE_TTL = "300"
RUST_LOG = "error"

