personality = "pragmatic"
model = "gpt-5.5"
model_reasoning_effort = "high"
model_instructions_file = "~/.dotfiles/ai/rules/agent-user-global.md"
project_doc_fallback_filenames = ["AGENTS.md"]

[mcp_servers.pctx]
type = "stdio"
command = "bash"
args = ["-c", "exec \"$HOME/.dotfiles/.local/bin/pctx_wrapper.sh\" mcp start --stdio -c \"$HOME/.config/pctx/pctx.json\""]
startup_timeout_sec = 90

[mcp_servers.notebooklm]
type = "stdio"
command = "bash"
args = ["-c", "exec \"$HOME/.local/bin/notebooklm-mcp\""]
startup_timeout_sec = 90

[mcp_servers.chrome-devtools]
type = "stdio"
command = "npx"
args = ["-y", "chrome-devtools-mcp@latest", "--chrome-arg=--no-sandbox", "--chrome-arg=--disable-setuid-sandbox"]
startup_timeout_sec = 90

[mcp_servers.serena]
type = "stdio"
command = "bash"
args = ["-c", "export PATH=\"$HOME/.local/bin:$HOME/.cargo/bin:$HOME/homebrew/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:${PATH:-}\"; exec \"$HOME/.dotfiles/.local/bin/serena_wrapper.sh\" \"$@\"", "serena", "--context", "claude-code", "--project-from-cwd", "--log-level", "ERROR"]
startup_timeout_sec = 90

[features]
unified_exec = true
shell_snapshot = true
multi_agent = true
prevent_idle_sleep = true

[tui]
status_line = ["model-with-reasoning", "current-dir", "git-branch", "context-remaining"]
